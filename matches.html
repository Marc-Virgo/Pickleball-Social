<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match Maker</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell wide"><header class="topbar"><a class="back-link" href="attendance.html">← Attendance</a><h1>Social Match Maker</h1></header><section class="card"><div class="summary-grid"><div class="stat"><span id="presentCount">0</span><small>present</small></div><div class="stat"><span id="courtsUsed">0</span><small>courts this round</small></div><div class="stat"><span id="sitCount">0</span><small>sitting out</small></div></div><div class="settings-row"><div class="court-setting"><span>Available courts</span><strong id="selectedCourtsText">—</strong><a href="courts.html">Change</a></div><label>Game length<select id="gameMinutes"><option>8</option><option selected>10</option><option>12</option><option>15</option></select> min</label><label>Session length<select id="sessionMinutes"><option>90</option><option selected>120</option><option>130</option><option>150</option></select> min</label></div><div class="tournament-control"><div><strong>Tournament Mode</strong><p class="muted small-note">Enter team scores after each round. Standings use victory points and cumulative points scored.</p></div><label class="switch"><input id="tournamentMode" type="checkbox"><span class="slider"></span></label></div><p id="scheduleHint" class="muted"></p><div class="stack"><button id="generateRound" class="button primary">Generate Next Round</button><button id="completeRound" class="button secondary hidden">Complete Round</button></div></section><section id="currentRoundCard" class="card hidden"><div class="round-heading"><h2 id="roundTitle">Round</h2><span id="roundTime" class="pill"></span></div><div id="courtGrid" class="court-grid"></div><div id="byeBox" class="bye-box hidden"><h3>Sitting Out</h3><div id="byeList" class="chips"></div></div></section><section class="card"><div class="round-heading"><h2>Session History</h2><button id="resetSession" class="button danger compact">Reset session</button></div><div id="history"></div></section></main><script src="storage.js"></script><script src="scheduler.js"></script><script src="matches.js"></script></body></html>
