<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance | Social Pickleball</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="back-link" href="index.html">← Home</a>
      <h1>Player Attendance</h1>
    </header>

    <section class="card">
      <form id="addForm" class="add-row">
        <input id="playerName" type="text" placeholder="Player name" autocomplete="off" maxlength="50" required>
        <button class="button primary compact" type="submit">Add</button>
      </form>

      <div class="toolbar">
        <button id="allPresent" class="button ghost compact" type="button">All present</button>
        <button id="nonePresent" class="button ghost compact" type="button">Clear attendance</button>
      </div>

      <div class="attendance-summary">
        <strong><span id="presentCount">0</span> present</strong>
        <span id="courtForecast"></span>
      </div>

      <div id="playerList" class="player-list"></div>
    </section>

    <div class="sticky-actions">
      <a class="button primary" href="matches.html">Continue to Match Maker →</a>
    </div>
  </main>

  <script src="storage.js"></script>
  <script src="attendance.js"></script>
</body>
</html>
